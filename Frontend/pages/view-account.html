<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Account - Citi Bank</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header>
    <a href="../index.html"><h1>Citi Bank</h1></a>
    <p class="tagline">Banking made simple, secure, and yours.</p>
  </header>
  <main>
    <div class="card">
      <h2>View Account</h2>
      <p class="page-description">Enter your account ID to jump straight to your account details.</p>
      <form id="view-account-form">
        <label for="account-id">Account ID</label>
        <input type="number" id="account-id" min="1" required />
        <button type="submit">Submit</button>
      </form>
      <p class="error-message" id="error-message"></p>
      <a class="back-link" href="../index.html">&larr; Back to Home</a>
    </div>
  </main>
  <footer>&copy; 2026 Citi Bank Website &mdash; a demo banking project.</footer>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById("view-account-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorMessage = document.getElementById("error-message");
      errorMessage.textContent = "";

      const accountId = document.getElementById("account-id").value;

      try {
        await apiRequest(`/api/accounts/${accountId}`);
        window.location.href = `account-details.html?id=${accountId}`;
      } catch (error) {
        errorMessage.textContent = error.message;
      }
    });
  </script>
</body>
</html>

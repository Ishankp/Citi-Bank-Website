<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deposit - Citi Bank</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header>
    <a href="../index.html"><h1>Citi Bank</h1></a>
    <p class="tagline">Banking made simple, secure, and yours.</p>
  </header>
  <main>
    <div class="card">
      <h2>Deposit</h2>
      <p class="page-description">Add funds to your account. The new balance will be available immediately.</p>
      <form id="deposit-form">
        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01" min="0.01" required />
        <button type="submit">Submit</button>
      </form>
      <p class="error-message" id="error-message"></p>
      <a class="back-link" id="back-link" href="#">&larr; Back to Account</a>
    </div>
  </main>
  <footer>&copy; 2026 Citi Bank Website &mdash; a demo banking project.</footer>
  <script src="../js/api.js"></script>
  <script>
    const accountId = getQueryParam("id");
    document.getElementById("back-link").href = `account-details.html?id=${accountId}`;

    document.getElementById("deposit-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorMessage = document.getElementById("error-message");
      errorMessage.textContent = "";

      const amount = parseFloat(document.getElementById("amount").value);

      try {
        await apiRequest(`/api/accounts/${accountId}/deposit`, {
          method: "POST",
          body: JSON.stringify({ amount }),
        });
        window.location.href = `account-details.html?id=${accountId}`;
      } catch (error) {
        errorMessage.textContent = error.message;
      }
    });
  </script>
</body>
</html>

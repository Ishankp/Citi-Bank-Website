<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Citi Bank</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <a href="index.html"><h1>Citi Bank</h1></a>
    <p class="tagline">Banking made simple, secure, and yours.</p>
  </header>
  <main>
    <div class="card">
      <h2>Login</h2>
      <p class="page-description">Enter your email and password to access your accounts.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <button type="submit">Log In</button>
      </form>
      <p class="error-message" id="error-message"></p>
      <a class="back-link" href="index.html">&larr; Back to Home</a>
    </div>
  </main>
  <footer>&copy; 2026 Citi Bank Website &mdash; a demo banking project.</footer>
  <script src="js/api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorMessage = document.getElementById("error-message");
      errorMessage.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const token = await apiRequest("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });

        setSession(token.access_token, token.user);

        if (token.user.is_admin) {
          window.location.href = "pages/admin-dashboard.html";
        } else {
          window.location.href = "pages/select-account.html";
        }
      } catch (error) {
        errorMessage.textContent = error.message;
      }
    });
  </script>
</body>
</html>
